<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Pipeline</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <div class="container">

    <header>
      <h1>RAG Pipeline</h1>
      <p class="subtitle">Upload a document, then ask questions about it.</p>
    </header>

    <!-- Upload -->
    <section class="card" id="upload-section">
      <h2>1 — Upload a PDF</h2>
      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept=".pdf" multiple hidden />
        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
        <p>Drop PDFs here or <button class="link-btn" id="browse-btn">browse</button></p>
        <p class="dropzone-hint">Multiple .pdf files supported</p>
      </div>
      <div id="upload-status" class="status hidden"></div>
      <button id="clear-btn" class="clear-btn hidden">&#x2715; Clear selection</button>
    </section>

    <!-- Query -->
    <section class="card" id="query-section">
      <h2>2 — Ask a Question</h2>
      <textarea
        id="question-input"
        placeholder="e.g. What is the main argument of this paper?"
        rows="3"
      ></textarea>
      <div class="query-controls">
        <div class="control-group">
          <label for="k-input">Passages</label>
          <input type="number" id="k-input" value="5" min="1" max="20" />
        </div>
        <div class="control-group">
          <label for="min-score-input">Min score</label>
          <input type="number" id="min-score-input" value="0.0" min="0" max="1" step="0.05" />
        </div>
        <button id="query-btn" disabled>Ask</button>
      </div>
      <div id="query-status" class="status hidden"></div>
    </section>

    <!-- Answer -->
    <section class="card hidden" id="answer-section">
      <h2>Answer</h2>
      <div id="answer-text"></div>
      <div id="sources-section">
        <h3>Sources</h3>
        <div id="sources-list"></div>
      </div>
    </section>

  </div>
  <script src="/static/app.js?v=4"></script>
</body>
</html>
